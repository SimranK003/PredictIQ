[project]
name = "predictiq-backend"
version = "0.1.0"
description = "PredictIQ end-to-end ML prediction & monitoring platform backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
env = [
    "ENVIRONMENT=test",
]
