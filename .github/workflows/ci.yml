name: CI

# Validates every push/PR: backend tests+lint, frontend tests+lint+
# typecheck+build, and that both production Docker images actually
# build — matching this project's Docker Compose/Phase 8 architecture.
# `deploy` only runs on a push to main, only after every validation job
# has passed, and only does anything if a Render deploy hook secret has
# been configured (see README's CI/CD section) — it's a no-op otherwise,
# not a failure, since most forks/clones of this repo won't have one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: predictiq
          POSTGRES_PASSWORD: predictiq
          POSTGRES_DB: predictiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U predictiq -d predictiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      # requirements-dev.txt pulls in requirements.txt too (see that
      # file) plus pytest/ruff/pip-audit — none of which ship in the
      # actual production image (backend/Dockerfile installs
      # requirements.txt alone; Phase 10 hardening, see README's
      # Security review section).
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # Real schema, not a mocked one — same "run migrations against a
      # real Postgres" principle the app itself uses everywhere else
      # (see README's Testing section on why tests hit a real database).
      - name: Apply Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg2://predictiq:predictiq@localhost:5432/predictiq_test
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://predictiq:predictiq@localhost:5432/predictiq_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest

      # Informational only (does not fail the build) — mlflow 2.16.2
      # and starlette (pinned indirectly by fastapi==0.115.0) both have
      # known advisories with no drop-in fix version yet available
      # without a larger, riskier upgrade; see README's Security review
      # section for the accepted-risk reasoning. This step exists so
      # that risk stays visible in every CI run rather than silently
      # forgotten, without blocking merges on it.
      - name: Dependency vulnerability scan (informational)
        run: pip-audit -r requirements.txt || true

  frontend:
    name: Frontend tests + lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build-only (no push, no registry configured) — proves every
      # Dockerfile actually builds on a clean runner, catching the exact
      # class of "works locally, breaks in a fresh image" issue this
      # sandbox's own missing Docker install couldn't catch when these
      # Dockerfiles were first authored (see README's Deployment status
      # / Docker setup sections).
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8123

      - name: Build MLflow image
        uses: docker/build-push-action@v6
        with:
          context: infra/mlflow
          push: false

  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger deploy hook (if configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping deploy trigger."
            echo "See README's CI/CD section for how to configure it."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
